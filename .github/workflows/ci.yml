name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Pin the declared npm release
        shell: bash
        run: |
          npm install --global npm@10.9.3 --ignore-scripts
          test "$(npm --version)" = "10.9.3"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@10.9.3"

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete gate
        run: npm run check
