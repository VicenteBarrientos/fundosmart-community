<svg width="1128" height="191" viewBox="0 0 1128 191" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient-bull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030805"/>
      <stop offset="45%" stop-color="#081C12"/>
      <stop offset="85%" stop-color="#05120B"/>
      <stop offset="100%" stop-color="#020503"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <radialGradient id="emerald-glow-bull" cx="78%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030805" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassmorphic Card Fill -->
    <linearGradient id="glass-fill-bull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="border-accent-bull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1128" height="191" fill="url(#bg-gradient-bull)"/>

  <!-- Subtle Glow Layer -->
  <rect width="1128" height="191" fill="url(#emerald-glow-bull)"/>

  <!-- Paddock Mesh Vector Graphic (Right Side) -->
  <g opacity="0.12" stroke="#34D399" stroke-width="1.2" fill="none">
    <polygon points="750,20 880,10 940,70 820,95 740,50"/>
    <polygon points="820,95 940,70 1020,130 910,165 800,120"/>
    <polygon points="910,165 1020,130 1100,180 980,190"/>
    <polygon points="680,80 740,50 800,120 720,160 650,110"/>
    <circle cx="820" cy="95" r="4" fill="#34D399"/>
    <circle cx="940" cy="70" r="4" fill="#34D399"/>
    <circle cx="800" cy="120" r="4" fill="#10B981"/>
    <circle cx="910" cy="165" r="4" fill="#34D399"/>
  </g>

  <!-- Glassmorphic Dashboard Cards (Right Side) -->
  <g transform="translate(730, 28)">
    <rect x="0" y="0" width="170" height="60" rx="10" fill="url(#glass-fill-bull)" stroke="#34D399" stroke-opacity="0.2" stroke-width="1"/>
    <text x="14" y="24" fill="#A7F3D0" font-size="11" font-weight="600" letter-spacing="0.5">CONTROL LECHERO</text>
    <text x="14" y="44" fill="#FFFFFF" font-size="15" font-weight="700">98.4% <tspan fill="#34D399" font-size="11" font-weight="400">Calidad A1</tspan></text>

    <rect x="185" y="0" width="180" height="60" rx="10" fill="url(#glass-fill-bull)" stroke="#34D399" stroke-opacity="0.2" stroke-width="1"/>
    <text x="14" y="24" fill="#A7F3D0" font-size="11" font-weight="600" letter-spacing="0.5">TRAZABILIDAD DIIO</text>
    <text x="14" y="44" fill="#FFFFFF" font-size="15" font-weight="700">Ficha 360° <tspan fill="#34D399" font-size="11" font-weight="400">Ganado</tspan></text>

    <rect x="90" y="72" width="275" height="60" rx="10" fill="url(#glass-fill-bull)" stroke="#34D399" stroke-opacity="0.3" stroke-width="1"/>
    <text x="16" y="96" fill="#A7F3D0" font-size="11" font-weight="600" letter-spacing="0.5">PRADERAS Y POTREROS</text>
    <text x="16" y="116" fill="#FFFFFF" font-size="14" font-weight="700">Gestión Territorial Sur de Chile</text>
  </g>

  <!-- Left Side Branding: Official Geometric Bull Shield Logo -->
  <g transform="translate(60, 32)">
    <!-- Official FundoSmart Geometric Bull Shield Logo Icon -->
    <g transform="translate(0, 0)">
      <!-- Shield Outline -->
      <path d="M 26,4 L 46,12 L 46,32 C 46,44 26,52 26,52 C 26,52 6,44 6,32 L 6,12 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Bull Horns & Ears -->
      <path d="M 14,16 L 10,24 L 20,24 M 38,16 L 42,24 L 32,24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Bull Head Geometry -->
      <polygon points="20,24 32,24 30,38 22,38" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M 20,24 L 26,18 L 32,24 M 22,38 L 22,43 L 30,43 L 30,38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Brand Name (Official Logo Font Style) -->
    <text x="64" y="38" fill="#FFFFFF" font-size="36" font-weight="700" letter-spacing="-0.8">FundoSmart</text>

    <!-- Main Slogan -->
    <text x="0" y="82" fill="#F8FAFC" font-size="19" font-weight="700" letter-spacing="-0.2">
      La operación de tu fundo ganadero y lecherio en una sola plataforma
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 106)">
      <rect x="0" y="0" width="135" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="16" fill="#34D399" font-size="11" font-weight="600">Trazabilidad DIIO</text>

      <rect x="143" y="0" width="130" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="16" fill="#34D399" font-size="11" font-weight="600">Control Lechero</text>

      <rect x="281" y="0" width="145" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="16" fill="#34D399" font-size="11" font-weight="600">Potreros &amp; Praderas</text>

      <rect x="434" y="0" width="130" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="16" fill="#34D399" font-size="11" font-weight="600">Libro Financiero</text>
    </g>
  </g>

  <!-- CTA Badge -->
  <g transform="translate(940, 142)">
    <rect x="0" y="0" width="148" height="32" rx="16" fill="#10B981"/>
    <text x="74" y="20" fill="#040D08" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.2">fundosmart.com</text>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1128" height="3" fill="url(#border-accent-bull)"/>
</svg>
